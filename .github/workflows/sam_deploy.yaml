name: Build and Deploy SAM with Poetry

on:
  workflow_call:

defaults:
  run:
    working-directory: backend/infrastructure

permissions:
  id-token: write
  contents: read

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.8.2
      
      # The Playwright image has its own minimal, pinned requirements.txt.

      # Export dependencies for SearchResults Lambda Function

      - name: Export SearchResults dependencies
        run: |
          poetry export -f requirements.txt --without-hashes -o search_results/requirements.txt
        working-directory: backend/infrastructure

      # Set up AWS SAM CLI

      - name: Set up AWS SAM
        uses: aws-actions/setup-sam@v1

      # Configure AWS Credentials

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHubOIDCSAMDeployRole
          aws-region: ${{ secrets.AWS_REGION }}

      # Build SAM apps
      
      - name: Build Playwright stack
        run: sam build --template-file template-playwright.yaml --build-dir .aws-sam/playwright --use-container

      - name: Verify Chromium can launch with a read-only filesystem
        run: |
          docker run --rm --read-only --user 1000:1000 --tmpfs /tmp --entrypoint python \
            playwrightfunction:browser-v1 -c \
            'from playwright.sync_api import sync_playwright; p = sync_playwright().start(); b = p.chromium.launch(headless=True, args=["--no-sandbox", "--disable-dev-shm-usage", "--single-process"]); print(b.version); b.close(); p.stop()'

      - name: Build SearchResults stack
        run: sam build --template-file template-searchresults.yaml --build-dir .aws-sam/search_results --use-container


      # Playwright stack deploy

      - name: Deploy Playwright Stack
        env:
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          sam deploy \
            --template-file .aws-sam/playwright/template.yaml \
            --stack-name playwright-stack \
            --region $AWS_REGION \
            --capabilities CAPABILITY_IAM \
            --s3-bucket $AWS_S3_BUCKET \
            --s3-prefix sam-artifacts/playwright \
            --image-repositories PlaywrightFunction=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/bandify-playwright \
            --parameter-overrides S3BucketName=$AWS_S3_BUCKET SessionSecret=$SESSION_SECRET \
            --no-confirm-changeset

      - name: Dump Playwright stack events
        run: |
          aws cloudformation describe-stack-events \
            --stack-name playwright-stack \
            --region ${{ secrets.AWS_REGION }} \
            --max-items 20

      # SearchResults stack deploy

      - name: Deploy SearchResults Stack
        env:
          DB_URL: ${{ secrets.DB_URL }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          sam deploy \
            --template-file .aws-sam/search_results/template.yaml \
            --stack-name searchresults-stack \
            --region $AWS_REGION \
            --capabilities CAPABILITY_IAM \
            --s3-bucket $AWS_S3_BUCKET \
            --s3-prefix sam-artifacts/searchresults \
            --parameter-overrides DbUrl=$DB_URL S3BucketName=$AWS_S3_BUCKET \
              SpotifyClientId=$SPOTIFY_CLIENT_ID SpotifyClientSecret=$SPOTIFY_CLIENT_SECRET \
              SessionSecret=$SESSION_SECRET \
            --no-confirm-changeset

      - name: Verify SearchResults build artifacts
        run: |
          test -f .aws-sam/search_results/SearchResultsFunction/idna/__init__.py
          test -d .aws-sam/search_results/SearchResultsFunction/sqlalchemy

      - name: Dump SearchResults Stack Events
        run: |
          aws cloudformation describe-stack-events \
            --stack-name searchresults-stack \
            --region ${{ secrets.AWS_REGION }} \
            --max-items 20
