name: Deploy Frontend and Backend

on:
  workflow_dispatch:  # Manually triggered from GitHub Actions UI
  push:
    branches:
      - main 

permissions:
  id-token: write
  contents: read


jobs:
  deploy-frontend:
    uses: ./.github/workflows/frontend_deploy.yaml
    secrets: inherit

  deploy-backend:
    needs: deploy-frontend
    uses: ./.github/workflows/sam_deploy.yaml
    secrets: inherit