AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Search Results API Stack

Parameters:
  DbUrl:
    Type: String
    Description: The full connection URL for the Postgres DB

  S3BucketName:
    Type: String
    Description: Name of the S3 bucket this Lambda function will access

  SpotifyClientId:
    Type: String
    MinLength: 1
    Description: Client ID of the Spotify app used for sign-in

  SpotifyClientSecret:
    Type: String
    NoEcho: true
    MinLength: 1
    Description: Client secret of the Spotify app used for sign-in

  SessionSecret:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: Fixed random key that encrypts sign-in sessions; must stay the same across deploys

  FrontendUrl:
    Type: String
    Default: https://groovonomy.com
    Description: Origin of the front end; users return here after signing in

  # Existing network of the bandify-db-lite database; looked up, not created here
  DatabaseVpcId:
    Type: AWS::EC2::VPC::Id
    Default: vpc-00cd1b243fc013613
    Description: VPC of the Postgres database

  NatPublicSubnetId:
    Type: AWS::EC2::Subnet::Id
    Default: subnet-085d8ce371ba980f2
    Description: Existing public subnet (routed to the internet gateway) that holds the NAT gateway

  DatabaseSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Default: sg-0f9b7c302a164f578
    Description: Security group of the Postgres database; gains one rule admitting this function

  PrivateSubnetACidr:
    Type: String
    Default: 172.31.128.0/20
    Description: Unused CIDR block in the database VPC for the first private subnet

  PrivateSubnetBCidr:
    Type: String
    Default: 172.31.144.0/20
    Description: Unused CIDR block in the database VPC for the second private subnet

Globals:
  Function:
    Timeout: 3
    Tracing: Active
    LoggingConfig:
      LogFormat: JSON
    Tags:
      Project: Groovonomy
      Environment: Production

Resources:
  SearchResultsExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: LambdaBasicExecution
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: arn:aws:logs:*:*:log-group:/aws/lambda/*
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket
                Resource:
                  - !Sub arn:aws:s3:::${S3BucketName}
                  - !Sub arn:aws:s3:::${S3BucketName}/*
              # Lets Lambda create and remove the function's network interfaces in the VPC
              # (same actions as AWSLambdaVPCAccessExecutionRole, kept inline like the rest)
              - Effect: Allow
                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribeSubnets
                  - ec2:DeleteNetworkInterface
                  - ec2:AssignPrivateIpAddresses
                  - ec2:UnassignPrivateIpAddresses
                Resource: "*"

  # Private subnets for the function: it reaches the database over the VPC and
  # everything else (Spotify, the Playwright API, price sites) through the NAT gateway
  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref DatabaseVpcId
      CidrBlock: !Ref PrivateSubnetACidr
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: searchresults-private-a

  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref DatabaseVpcId
      CidrBlock: !Ref PrivateSubnetBCidr
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: searchresults-private-b

  NatGatewayIp:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: searchresults-nat

  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatGatewayIp.AllocationId
      SubnetId: !Ref NatPublicSubnetId
      Tags:
        - Key: Name
          Value: searchresults-nat

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref DatabaseVpcId
      Tags:
        - Key: Name
          Value: searchresults-private

  PrivateDefaultRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  PrivateSubnetARouteTable:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetA
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnetBRouteTable:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetB
      RouteTableId: !Ref PrivateRouteTable

  SearchResultsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Search results Lambda; outbound only
      VpcId: !Ref DatabaseVpcId
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: searchresults-lambda

  # The database keeps its existing rules; this adds the function as a client
  DatabaseIngressFromSearchResults:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref DatabaseSecurityGroupId
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref SearchResultsSecurityGroup
      Description: Postgres from the search results Lambda

  SearchResultsFunction:
    Type: AWS::Serverless::Function
    # Attach only once outbound internet and database access are in place
    DependsOn:
      - PrivateDefaultRoute
      - PrivateSubnetARouteTable
      - PrivateSubnetBRouteTable
      - DatabaseIngressFromSearchResults
    Properties:
      CodeUri: search_results/
      Handler: app.lambda_handler
      Runtime: python3.11
      # Stays under API Gateway's 29 second integration limit
      Timeout: 28
      MemorySize: 512
      Role: !GetAtt SearchResultsExecutionRole.Arn
      VpcConfig:
        SecurityGroupIds:
          - !Ref SearchResultsSecurityGroup
        SubnetIds:
          - !Ref PrivateSubnetA
          - !Ref PrivateSubnetB
      Events:
        # /login, /callback, /get_playlists, /get_tracks/{id}, /db_results and CORS preflight
        ApiEndpoint:
          Type: Api
          Properties:
            Path: /{proxy+}
            Method: any
      Environment:
        Variables:
          DB_URL: !Ref DbUrl
          PLAYWRIGHT_API_URL: !ImportValue PlaywrightApiUrlExport
          CLIENT_ID: !Ref SpotifyClientId
          CLIENT_SECRET: !Ref SpotifyClientSecret
          SESSION_SECRET: !Ref SessionSecret
          FRONTEND_URL: !Ref FrontendUrl
      Tags:
        FunctionPurpose: SearchResults
   

Outputs:
  SpotifyRedirectUri:
    Description: Redirect URI to register in the Spotify developer dashboard
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/callback"
  SearchResultsFunction:
    Description: Search Results Lambda Function ARN
    Value: !GetAtt SearchResultsFunction.Arn
